# Saves a NASA DONKI snapshot for the GitHub Pages copy of the Space Weather dashboard.
# (Inside Claude the page fetches live data through TinyFish and ignores this file.)
name: DONKI snapshot
on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours, off the hour
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: donki-snapshot
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 tools/test_fetch_donki.py
      - run: python3 tools/fetch_donki.py
      - name: Commit if changed
        run: |
          git add data/donki.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git -c user.name="Baskers1" -c user.email="80006080+Baskers1@users.noreply.github.com" commit -m "DONKI snapshot $(date -u +'%Y-%m-%d %H:%M')"
          git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
